name: CI (Trunk runners shadow)
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Branch validation · {0}', github.ref_name) || github.event_name == 'merge_group' && 'Merge queue validation' || format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

# Shadow copy of ci.yml that runs on Trunk runners (template .trunk/templates/ci.yaml, slug "ci"),
# next to ci.yml on the same commits. It is NOT a required check: ci.yml stays the merge gate.
# Delete this file when ci.yml moves to Trunk runners. Keep the jobs in sync with ci.yml until then.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Checks, unit tests, and shared desktop assets (trunk runners)
    # Trunk runners run only code from this repository: skip pull requests from forks.
    # smoke and package need prepare, so they are skipped too.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high..template=ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install desktop and asset dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          # FontTools recommends large optional scientific Python packages. xauth is needed by xvfb-run.
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libsdl2-dev pkg-config woff2 python3-fonttools libgl1-mesa-dri xvfb xauth
      - name: Check formatting
        run: pnpm format:check
      - name: Lint Rust and packaging tools
        run: pnpm check
      - name: Run unit tests
        run: pnpm test
      - name: Generate native assets
        run: pnpm assets
      - name: Build shared desktop preview
        run: cargo build --locked --package luma --no-default-features
      - name: Bundle shared smoke inputs
        run: tar -czf smoke-inputs.tar.gz .build/assets target/debug/luma
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-inputs
          path: smoke-inputs.tar.gz
          retention-days: 1

  smoke:
    name: Smoke / ${{ matrix.suite }} (trunk runners)
    needs: prepare
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high..template=ci
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Navigation and rendering
            script: tests/smoke.mjs
            artifact: navigation
          - suite: Brand gallery
            script: tests/brands-smoke.mjs
            artifact: brands
          - suite: Mock weather
            script: tests/weather-smoke.mjs
            artifact: weather
          - suite: Translations
            script: tests/translations-smoke.mjs
            artifact: translations
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install desktop rendering dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libsdl2-2.0-0 libgl1-mesa-dri xvfb xauth
      - uses: actions/download-artifact@v8
        with:
          name: smoke-inputs
      - run: tar -xzf smoke-inputs.tar.gz
      - name: Run isolated smoke suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LUMA_SMOKE_SKIP_BUILD: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node "${{ matrix.script }}"
      - name: Upload native rendering diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-rendering-${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            .build/*.png
            .build/*-render.json

  package:
    name: Verified ARM IPK and Homebrew feed (trunk runners)
    needs: prepare
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high..template=ci
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: webos-${{ hashFiles('tools/build-webos.sh', 'tools/setup-webos-sdk.mjs', 'tools/webos-runtime.mjs') }}
      - name: Install cross-build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends pkg-config
      - uses: actions/download-artifact@v8
        with:
          name: smoke-inputs
      - name: Restore generated native assets
        run: tar -xzf smoke-inputs.tar.gz .build/assets
      - name: Set up the webOS SDK
        run: pnpm sdk
      - name: Cross-build and verify the native IPK and Homebrew feed
        id: package
        run: |
          export WEBOS_NDK="$GITHUB_WORKSPACE/.build/toolchain/arm-webos-linux-gnueabi_sdk-buildroot"
          pnpm build
          node tools/package.mjs
          node tools/repository.mjs
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: luma-release
          if-no-files-found: error
          path: |
            dist/*.ipk
            dist/sha256sums
            dist/repo.json
            dist/description.html
            dist/app-icon-large.png
  build:
    # Shadow of the required-check aggregate in ci.yml. This copy is not a required check.
    name: Rust checks, rendering, and native package (trunk runners)
    needs: [prepare, smoke, package]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high..template=ci
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
            if (job.result !== 'success') process.exitCode = 1;
          }
          NODE

  summary:
    name: Validation summary (trunk runners)
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [prepare, smoke, package, build]
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high..template=ci
    timeout-minutes: 5
    steps:
      - name: Summarize validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jobs = JSON.parse(process.env.RESULTS);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Luma ${process.env.RELEASE_TAG || ''} validation`, '',
            '| Stage | Result |', '| --- | --- |',
            ...Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`), '',
            'Validation only. Run the **Release** workflow to publish.', '',
          ].join('\n'));
          NODE
