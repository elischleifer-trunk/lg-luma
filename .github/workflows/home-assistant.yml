name: Home Assistant integration

on:
  push:
    branches: [main]
    paths:
      [
        'custom_components/**',
        'tests/home-assistant/**',
        'ruff.toml',
        'hacs.json',
        '.github/workflows/home-assistant.yml',
      ]
  pull_request:
    paths:
      [
        'custom_components/**',
        'tests/home-assistant/**',
        'ruff.toml',
        'hacs.json',
        '.github/workflows/home-assistant.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Trunk Dynamic CI (https://docs.trunk.io/ci/dynamic-ci): skips the test job on a pull request
  # only when Trunk returns an explicit 'false' for it. Off pull requests (pushes to main), on fork
  # PRs without the secret, or when Trunk is unreachable, there is no verdict and the job runs.
  dynamic-ci:
    name: Dynamic CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.dynamic-ci.outputs.test }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - id: dynamic-ci
        uses: trunk-io/dynamic-ci@v1
        with:
          token: ${{ secrets.TRUNK_API_TOKEN }}
          enable-annotation: true

  test:
    name: Lint and test custom_components/luma
    needs: [dynamic-ci]
    if: >-
      !cancelled() &&
      needs.dynamic-ci.outputs.test != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component==0.13.316 ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -p no:cacheprovider tests/home-assistant
