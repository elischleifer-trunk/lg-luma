name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Branch validation · {0}', github.ref_name) || github.event_name == 'merge_group' && 'Merge queue validation' || github.event_name == 'push' && format('Main validation · {0}', github.event.head_commit.message) || format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

# Validation only, and the merge gate: require "Rust checks, rendering, and native package" in the
# main branch ruleset so a PR cannot merge unless this passes. On pull requests Trunk Dynamic CI may
# skip the smoke and package jobs, so every push to main runs the full suite (Dynamic CI does not
# run off pull requests) and a mispredicted skip is caught on the commit that introduced it.
# release.yml calls this workflow again on the exact commit it publishes. merge_group lets the same
# check gate a merge queue if the repository moves to an organization (queues are org-only).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Trunk Dynamic CI (https://docs.trunk.io/ci/dynamic-ci): asks Trunk, from this repository's own
  # CI history, which of the expensive jobs below this pull request needs. Each gated job reads its
  # verdict and is skipped only on an explicit 'false'. It fails open: off pull requests (merge
  # queue, branch validation, the Release workflow's call), on fork PRs without the secret, or when
  # Trunk is unreachable, there is no verdict and every job runs.
  dynamic-ci:
    name: Dynamic CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Lets the action read the PR's changed files when the checkout lacks the base commit.
      pull-requests: read
    # One output per gated job, named by its job key. The action sets them at runtime, so each one
    # has to be re-exported here.
    outputs:
      smoke: ${{ steps.dynamic-ci.outputs.smoke }}
      package: ${{ steps.dynamic-ci.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - id: dynamic-ci
        uses: trunk-io/dynamic-ci@v1
        with:
          token: ${{ secrets.TRUNK_API_TOKEN }}
          enable-annotation: true

  # Not gated: formatting, lint and unit tests always run, and the smoke and package jobs need its
  # shared build outputs.
  prepare:
    name: Checks, unit tests, and shared desktop assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install desktop and asset dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          # FontTools recommends large optional scientific Python packages. xauth is needed by xvfb-run.
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libsdl2-dev pkg-config woff2 python3-fonttools libgl1-mesa-dri xvfb xauth
      - name: Check formatting
        run: pnpm format:check
      - name: Lint Rust and packaging tools
        run: pnpm check
      - name: Run unit tests
        run: pnpm test
      - name: Generate native assets
        run: pnpm assets
      - name: Build shared desktop preview
        run: cargo build --locked --package luma --no-default-features
      - name: Bundle shared smoke inputs
        run: tar -czf smoke-inputs.tar.gz .build/assets target/debug/luma
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-inputs
          path: smoke-inputs.tar.gz
          retention-days: 1

  smoke:
    name: Smoke / ${{ matrix.suite }}
    needs: [dynamic-ci, prepare]
    # !cancelled() keeps the job running when dynamic-ci is skipped or fails; compare with
    # != 'false' so that a missing verdict runs the job.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.dynamic-ci.outputs.smoke != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Navigation and rendering
            script: tests/smoke.mjs
            artifact: navigation
          - suite: Brand gallery
            script: tests/brands-smoke.mjs
            artifact: brands
          - suite: Mock weather
            script: tests/weather-smoke.mjs
            artifact: weather
          - suite: Translations
            script: tests/translations-smoke.mjs
            artifact: translations
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install desktop rendering dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libsdl2-2.0-0 libgl1-mesa-dri xvfb xauth
      - uses: actions/download-artifact@v8
        with:
          name: smoke-inputs
      - run: tar -xzf smoke-inputs.tar.gz
      - name: Run isolated smoke suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LUMA_SMOKE_SKIP_BUILD: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node "${{ matrix.script }}"
      - name: Upload native rendering diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-rendering-${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            .build/*.png
            .build/*-render.json

  package:
    name: Verified ARM IPK and Homebrew feed
    needs: [dynamic-ci, prepare]
    # The Release workflow calls this workflow off a pull request, so dynamic-ci never runs there
    # and the release package is always built.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.dynamic-ci.outputs.package != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: webos-${{ hashFiles('tools/build-webos.sh', 'tools/setup-webos-sdk.mjs', 'tools/webos-runtime.mjs') }}
      - name: Install cross-build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends pkg-config
      - uses: actions/download-artifact@v8
        with:
          name: smoke-inputs
      - name: Restore generated native assets
        run: tar -xzf smoke-inputs.tar.gz .build/assets
      - name: Set up the webOS SDK
        run: pnpm sdk
      - name: Cross-build and verify the native IPK and Homebrew feed
        id: package
        run: |
          export WEBOS_NDK="$GITHUB_WORKSPACE/.build/toolchain/arm-webos-linux-gnueabi_sdk-buildroot"
          pnpm build
          node tools/package.mjs
          node tools/repository.mjs
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: luma-release
          if-no-files-found: error
          path: |
            dist/*.ipk
            dist/sha256sums
            dist/repo.json
            dist/description.html
            dist/app-icon-large.png
  build:
    # Preserve the existing required-check name as the aggregate of all jobs. Never gate this job
    # with Dynamic CI: it is the fan-in that reports the required check.
    name: Rust checks, rendering, and native package
    needs: [dynamic-ci, prepare, smoke, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          SMOKE_VERDICT: ${{ needs.dynamic-ci.outputs.smoke }}
          PACKAGE_VERDICT: ${{ needs.dynamic-ci.outputs.package }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          // A job may be skipped only when Dynamic CI said so. The dynamic-ci job itself is
          // advisory: its failure or absence just means every job ran.
          const skippable = {
            smoke: process.env.SMOKE_VERDICT === 'false',
            package: process.env.PACKAGE_VERDICT === 'false',
          };
          for (const [name, job] of Object.entries(jobs)) {
            if (name === 'dynamic-ci') {
              console.log(`${name}: ${job.result} (advisory)`);
              continue;
            }
            const skipped = job.result === 'skipped' && skippable[name];
            console.log(`${name}: ${job.result}${skipped ? ' (skipped by Trunk Dynamic CI)' : ''}`);
            if (job.result !== 'success' && !skipped) process.exitCode = 1;
          }
          NODE

  summary:
    name: Validation summary
    if: always()
    needs: [dynamic-ci, prepare, smoke, package, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jobs = JSON.parse(process.env.RESULTS);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Luma ${process.env.RELEASE_TAG || ''} validation`, '',
            '| Stage | Result |', '| --- | --- |',
            ...Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`), '',
            'Validation only. Run the **Release** workflow to publish.', '',
          ].join('\n'));
          NODE
