name: Release
run-name: 'Release Luma (${{ inputs.bump }})'

# The only way to publish Luma. Run it from Actions → Release → Run workflow on main:
#   1. Bump the version (minor by default, or major) on a release/vX.Y.Z branch, and look for a
#      complete, passing CI run on main's exact code (a tree match: merge-queue and up-to-date PR
#      runs test the code that lands under another commit ID).
#   2. If one exists, only build the verified ARM IPK and Homebrew feed for the release commit
#      (package.yml): the bump changes nothing but version strings, so checks and smoke suites
#      would re-test code that already passed. Otherwise, or when asked, run the full CI
#      validation (ci.yml: checks, smoke suites, verified ARM IPK) on the release commit.
#   3. Fast-forward main to the release commit, publish the GitHub release (a "What's new"
#      section from the merged pull requests' summaries over the list of them;
#      tools/release-notes.mjs), mirror it to R2.
# If any step before 3 fails, main and the published feed are untouched.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "auto" releases the next minor version (x.Y.0); "major" releases X.0.0.
        type: choice
        options: [auto, major]
        default: auto
      full_validation:
        description: Run the full CI validation even when main's code already passed CI.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  version:
    name: Bump version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # To find the CI run that already passed on main's code.
      actions: read
      statuses: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      base: ${{ steps.commit.outputs.base }}
      validated: ${{ steps.tested.outputs.validated }}
      evidence: ${{ steps.tested.outputs.evidence }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # main's code counts as validated when a CI run tested exactly this tree and every job in it
      # ran and passed (a PR run may have had smoke or package skipped by Dynamic CI, which does not
      # count), or when main's tip is a previous release commit, which carries the required status.
      - name: Find a passing CI run on main's code
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FULL: ${{ inputs.full_validation }}
          CHECK: Rust checks, rendering, and native package
        run: |
          validated=false
          evidence=''
          base="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$FULL" = true ]; then
            evidence='full validation requested'
          elif [ -n "$(gh api "repos/$GH_REPO/commits/$base/status" \
              --jq ".statuses[] | select(.context == env.CHECK and .state == \"success\") | .state")" ]; then
            validated=true
            evidence="main's tip ${base:0:12} carries a successful \"$CHECK\" status"
          else
            # A pull_request run tests the PR merged into its base (refs/pull/N/merge), not its
            # head. The head's tree is the tested tree only when the base is an ancestor of the
            # head, so other pull_request runs (or ones whose base can't be found) don't count.
            # The run lists its PR only while the PR is open; merge-queue test PRs are closed by
            # now, so otherwise the base comes from the PR (open or closed) whose head is the run's
            # branch and commit. Any failed lookup skips the run, which at worst means full
            # validation.
            while read -r id event sha base owner branch url; do
              [ -n "$id" ] || continue
              [ "$(gh api "repos/$GH_REPO/git/commits/$sha" --jq .tree.sha 2>/dev/null)" = "$tree" ] || continue
              if [ "$event" = pull_request ]; then
                if [ "$base" = - ]; then
                  base="$(gh api -X GET "repos/$GH_REPO/pulls" -f state=all -f "head=$owner:$branch" \
                    -f per_page=100 --jq '[.[] | select(.head.sha == "'"$sha"'")][0].base.sha // empty' \
                    2>/dev/null || true)"
                fi
                [ -n "$base" ] && [ "$base" != - ] || continue
                case "$(gh api "repos/$GH_REPO/compare/$base...$sha" --jq .status 2>/dev/null || true)" in
                  ahead | identical) ;;
                  *) continue ;;
                esac
              fi
              incomplete="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name != "Dynamic CI" and .conclusion != "success")] | length' \
                2>/dev/null || true)"
              if [ "$incomplete" = 0 ]; then
                validated=true
                evidence="CI run $url passed every job on main's code"
                break
              fi
            done < <(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?status=success&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.event) \(.head_sha) \(.pull_requests[0].base.sha // "-") \(.head_repository.owner.login // "-") \(.head_branch // "-") \(.html_url)"')
            [ "$validated" = true ] || evidence="no complete, passing CI run tested main's code"
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          if [ "$validated" = true ]; then
            echo "Already validated: $evidence. Packaging only." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Running the full CI validation: $evidence." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply the version bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = major ]; then kind=major; else kind=minor; fi
          node tools/sync-version.mjs --bump "$kind"
          node tools/sync-version.mjs --check
      - name: Commit to a release branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          base="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Release $tag"
          git push --force origin "HEAD:refs/heads/release/$tag"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  # main's code already passed CI: build the release commit's package only.
  package:
    name: Package
    needs: version
    if: needs.version.outputs.validated == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  # main's code has not passed a complete CI run (for example, a PR merged without the queue), or a
  # full validation was requested: validate the release commit, which also packages it.
  validate:
    name: Validate
    needs: version
    if: needs.version.outputs.validated != 'true'
    permissions:
      contents: read
      # ci.yml's Trunk Dynamic CI job declares this. It only runs on pull requests, so a release
      # always runs every validation job, but a called workflow may not request more than this grants.
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  publish:
    name: Publish GitHub release
    needs: [version, package, validate]
    # Exactly one of package and validate runs; it must have passed.
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      ((needs.package.result == 'success' && needs.validate.result == 'skipped') ||
       (needs.validate.result == 'success' && needs.package.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: luma-release
          path: release
      # Written before main moves, so a GitHub API failure here leaves nothing half-published.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          # The latest stable release; nightly prereleases are never "latest".
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          node tools/release-notes.mjs --tag "$TAG" --previous "$previous" --target "$SHA" \
            --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Fast-forward main and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          BASE: ${{ needs.version.outputs.base }}
          VALIDATED: ${{ needs.version.outputs.validated }}
        run: |
          packaged="$(basename release/*_arm.ipk)"
          if [[ "$packaged" != *"_${TAG#v}_arm.ipk" ]]; then
            printf 'Packaged %s does not match %s\n' "$packaged" "$TAG" >&2
            exit 1
          fi
          main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$main" != "$BASE" ] && [ "$main" != "$SHA" ]; then
            echo "::error::main moved during the release ($BASE → $main). Run Release again."
            exit 1
          fi
          # Either the validate job ran the full CI on this exact commit, or CI already passed on
          # main's code and this commit only changes version strings. Record that under the check
          # name the main-branch ruleset requires so the fast-forward is accepted.
          if [ "$VALIDATED" = true ]; then
            description="Code passed CI before the bump; packaged by Release run $GITHUB_RUN_ID"
          else
            description="Validated by Release run $GITHUB_RUN_ID"
          fi
          gh api "repos/$GH_REPO/statuses/$SHA" -f state=success \
            -f context='Rust checks, rendering, and native package' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          # Not forced: GitHub rejects anything but a fast-forward.
          gh api -X PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$SHA" -F force=false > /dev/null
          gh release create "$TAG" release/*.ipk release/sha256sums release/repo.json \
            release/description.html release/app-icon-large.png \
            --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "Luma ${TAG#v}"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/release/$TAG" || true
          echo "### Published [$TAG]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Publish to Cloudflare R2
    needs: [version, publish]
    # publish has a skipped ancestor (package or validate), which would skip this job by default.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-r2.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
