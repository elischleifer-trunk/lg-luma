name: PR Test IPK

# Builds untrusted PR code, so it runs on `pull_request`: no secrets, a read-only token and the
# PR's own cache scope. `pr-test-ipk-comment.yml` posts the download link from a separate,
# trusted `workflow_run` that never checks out or downloads anything from this run.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-test-ipk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR test IPK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Build the exact PR head commit (not GitHub's merge commit) without persisted credentials.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: armv7-unknown-linux-gnueabi
      - name: Install asset dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libsdl2-dev pkg-config woff2 python3-fonttools
      - name: Generate native assets
        run: pnpm assets
      - name: Set up the webOS SDK
        run: pnpm sdk
      - name: Cross-build and verify the test IPK
        run: |
          export WEBOS_NDK="$GITHUB_WORKSPACE/.build/toolchain/arm-webos-linux-gnueabi_sdk-buildroot"
          pnpm build
          node tools/package.mjs
      - name: Upload test IPK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: luma-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          path: |
            dist/*.ipk
            dist/sha256sums
