<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Criterion Channel</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- webOS adds this script to the Channel's pages too; it runs once per page. -->
    <script src="webOSUserScripts/userScript.js"></script>
    <script>
      // On to the film Luma asked for once Luma has given the player its sign-in (a few seconds
      // at most); the Channel's own page does the rest.
      var palm = window.PalmSystem;
      var params = LumaCriterion.parse(palm && palm.launchParams);
      LumaCriterion.prepare(params, 4000, function () {
        location.replace(LumaCriterion.target(params));
      });
    </script>
  </body>
</html>
