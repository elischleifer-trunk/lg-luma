<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luma Overlay</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <section id="card" class="card" hidden>
      <div class="frame">
        <img id="feed" alt="" />
        <p id="status" class="status" hidden>Connecting to camera…</p>
      </div>
      <header>
        <span class="live" aria-hidden="true"></span>
        <div class="text">
          <h1 id="title"></h1>
          <p id="message" hidden></p>
        </div>
        <span class="hint">BACK to close</span>
      </header>
      <div class="progress"><i id="bar"></i></div>
    </section>
    <section id="gallery" class="gallery" hidden>
      <header class="gallery-header">
        <h2>Cameras</h2>
        <span class="hint">OK to enlarge · BACK to close</span>
      </header>
      <div id="grid" class="grid"></div>
      <div id="single" class="single" hidden>
        <img id="single-feed" alt="" />
        <p id="single-status" class="status" hidden>Connecting to camera…</p>
        <p id="single-name" class="single-name"></p>
      </div>
    </section>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
