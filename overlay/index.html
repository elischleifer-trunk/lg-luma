<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luma Overlay</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <section id="card" class="card" hidden>
      <div class="frame">
        <img id="feed" alt="" />
        <video id="card-video" muted playsinline></video>
        <p id="status" class="status" hidden>Connecting to camera…</p>
      </div>
      <header>
        <span class="live" aria-hidden="true"></span>
        <div class="text">
          <h1 id="title"></h1>
          <p id="message" hidden></p>
        </div>
      </header>
      <div class="progress"><i id="bar"></i></div>
    </section>
    <section id="video" class="video" hidden>
      <video id="player" autoplay playsinline></video>
      <img id="video-cover" class="video-cover" alt="" hidden />
      <p id="video-live" class="video-badge live-badge" hidden>Live</p>
      <p id="video-title" class="video-title"></p>
      <div id="video-scrub" class="scrub" hidden>
        <p class="scrub-times"><span id="video-position"></span><span id="video-window"></span></p>
        <div class="scrub-track"><i id="video-played"></i><b id="video-knob"></b></div>
      </div>
    </section>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
